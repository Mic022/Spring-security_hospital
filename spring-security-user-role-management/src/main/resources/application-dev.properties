# Desarrollo - PostgreSQL
server.port=8050

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_gestion_usuarios}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# La tabla user conserva su nombre y se cita porque USER es una palabra reservada.
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Administrador inicial para desarrollo; solo se crea si no existe.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.username=${ADMIN_USERNAME:superadmin}
app.bootstrap.email=${ADMIN_EMAIL:superadmin@localhost}
app.bootstrap.password=${ADMIN_PASSWORD:SuperAdmin123!}

# Configuración JWT (HMAC256). Las variables de entorno permiten reemplazar valores.
security.jwt.secret=${JWT_SECRET:solo-desarrollo-cambiar-en-produccion-0123456789}
security.jwt.issuer=${JWT_ISSUER:hospital-api}
# Duración: 30m = 30 minutos, 8h = 8 horas, 15d = 15 días; también admite ISO-8601.
security.jwt.expiration=${JWT_EXPIRATION:8h}

# En desarrollo se acepta cualquier origen (frontend abierto desde archivo o Live Server).
app.cors.allowed-origins=${CORS_ORIGINS:*}
# Zona horaria del hospital para fechas y días del reporte.
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# Fuerza bruta: intentos fallidos antes de bloquear usuario+IP, y duración del bloqueo.
app.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.login.bloqueo=${LOGIN_BLOQUEO:15m}
