# Producción. Activar con SPRING_PROFILES_ACTIVE=prod.
# Las variables sin valor por defecto son obligatorias: si faltan, la aplicación no arranca.
server.port=${PORT:8050}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# El administrador inicial solo se crea si se activa explícitamente (y exige ADMIN_PASSWORD).
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.username=${ADMIN_USERNAME:superadmin}
app.bootstrap.email=${ADMIN_EMAIL:superadmin@localhost}
app.bootstrap.password=${ADMIN_PASSWORD:}

# JWT: secreto obligatorio de al menos 32 caracteres; los tokens duran 8 horas.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:hospital-api}
security.jwt.expiration=${JWT_EXPIRATION:8h}

# Dominios del frontend separados por comas, p. ej. https://hospital.example.com
app.cors.allowed-origins=${CORS_ORIGINS}
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# Swagger desactivado en producción.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Fuerza bruta: intentos fallidos antes de bloquear usuario+IP, y duración del bloqueo.
app.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.login.bloqueo=${LOGIN_BLOQUEO:15m}
