# PostgreSQL para desarrollo. Las credenciales coinciden con los valores
# Uso: docker compose up -d  (detener: docker compose down)
# por defecto de application-dev.properties; no usar en producción.
services:
  postgres:
    image: postgres:17
    container_name: hospital_postgres
    environment:
      POSTGRES_DB: sistema_gestion_usuarios
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sistema_gestion_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
